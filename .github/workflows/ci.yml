
name: CI
run-name: continuous integration

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt update && sudo apt install -y valgrind bison util-linux

      - run: make -C src
        env:
          CC: gcc

      - run: |
          echo "TERM=${TERM-unset}"
          tty || true
          test -t 0 && echo "stdin is a TTY" || echo "stdin is not a TTY"
          test -t 1 && echo "stdout is a TTY" || echo "stdout is not a TTY"
          cd ./tests
          ./run_all_tests.sh
        shell: bash
        env:
          CC: gcc
          TERM: xterm-256color
